<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BMP REST · Restaurant Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <link rel="stylesheet" href="rest.login.css">
</head>

<body class="lang-ar">

    <div class="bg-blob bg-blob-1" aria-hidden="true"></div>
    <div class="bg-blob bg-blob-2" aria-hidden="true"></div>
    <div class="bg-grid" aria-hidden="true"></div>

    <header class="topbar">
        <a href="rest.login.html" class="topbar-logo">
            <i class="fas fa-cubes"></i> BMP
        </a>

        <div class="lang-switcher" role="group" aria-label="Language">
            <button type="button" class="lang-btn active" data-lang="ar">عربية</button>
            <button type="button" class="lang-btn"        data-lang="fr">Français</button>
            <button type="button" class="lang-btn"        data-lang="en">English</button>
        </div>
    </header>

    <main class="login-page">

        <div class="login-card">

            <div class="login-header">
                <div class="brand-mark"><i class="fas fa-utensils"></i></div>

                <h1>BMP REST</h1>

                <h2 data-ar="تسجيل دخول المطعم"
                    data-fr="Connexion du restaurant"
                    data-en="Restaurant Login">
                    تسجيل دخول المطعم
                </h2>

                <p data-ar="قم بتسجيل الدخول إلى حساب مطعمك."
                   data-fr="Connectez-vous à votre compte restaurant."
                   data-en="Sign in to your restaurant account.">
                    قم بتسجيل الدخول إلى حساب مطعمك.
                </p>
            </div>

            <form id="loginForm" novalidate>

                <div class="form-group">
                    <label for="username"
                           data-ar="اسم المستخدم"
                           data-fr="Nom d'utilisateur"
                           data-en="Username">
                        اسم المستخدم
                    </label>

                    <div class="input-wrap">
                        <i class="fas fa-user input-icon" aria-hidden="true"></i>

                        <input type="text"
                               id="username"
                               autocomplete="username"
                               data-ar-placeholder="أدخل اسم المستخدم"
                               data-fr-placeholder="Entrez le nom d'utilisateur"
                               data-en-placeholder="Enter username"
                               placeholder="أدخل اسم المستخدم"
                               required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password"
                           data-ar="كلمة المرور"
                           data-fr="Mot de passe"
                           data-en="Password">
                        كلمة المرور
                    </label>

                    <div class="input-wrap">
                        <i class="fas fa-lock input-icon" aria-hidden="true"></i>

                        <input type="password"
                               id="password"
                               autocomplete="current-password"
                               data-ar-placeholder="أدخل كلمة المرور"
                               data-fr-placeholder="Entrez le mot de passe"
                               data-en-placeholder="Enter password"
                               placeholder="أدخل كلمة المرور"
                               required>

                        <button type="button"
                                class="toggle-password"
                                id="togglePassword"
                                aria-label="Show / hide password"
                                tabindex="-1">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit"
                        id="loginButton"
                        class="btn btn-primary">
                    <span class="btn-spinner" aria-hidden="true"></span>
                    <span class="btn-label"
                          data-ar="تسجيل الدخول"
                          data-fr="Connexion"
                          data-en="Login">
                        تسجيل الدخول
                    </span>
                </button>

                <div id="errorMessage" class="error-message" role="alert"></div>

            </form>

            <div class="login-footer">
                <a href="../BMP"
                   data-ar="دخول المسؤول"
                   data-fr="Connexion administrateur"
                   data-en="Admin login">
                    دخول المسؤول
                </a>
            </div>

        </div>

    </main>

    <script src="rest.auth.js"></script>
    <script src="rest.login.js"></script>

</body>

</html>
